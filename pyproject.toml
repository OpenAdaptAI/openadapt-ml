[project]
name = "openadapt-ml"
version = "0.16.3"
description = "Model-agnostic, domain-agnostic ML engine for GUI automation agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "MLDSAI Inc.", email = "richard@mldsai.com"}
]
keywords = ["gui", "automation", "ml", "vision-language-models", "vlm", "fine-tuning", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "anthropic>=0.75.0",
    "click>=8.1.0", # CLI framework
    "google-generativeai>=0.8.5",
    "matplotlib>=3.10.7",
    "modal>=1.3.4",
    "openadapt-capture>=0.3.0",
    # Canonical schema package. Benchmark* types (Task/Observation/Action/Agent)
    # live here so ml and evals don't import each other (breaks ml<->evals cycle).
    # NOTE: requires the openadapt-types release that adds openadapt_types.benchmark.
    "openadapt-types>=0.3.0",
    "pillow>=12.0.0",
    "pyautogui>=0.9.54",
    "pydantic-settings>=2.0.0",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
api = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "pydantic-settings>=2.0.0",
]
azure = [
    # Azure ML for distributed training
    "azure-ai-ml>=1.0.0",
    "azure-identity>=1.0.0",
]
lambda-labs = [
    "requests>=2.28.0",
]
parquet = [
    "pyarrow>=14.0.0",
]
# Heavy ML dependencies for local model training and inference
training = [
    "bitsandbytes>=0.41.0", # For 4-bit quantization
    "peft>=0.18.0",
    "torch>=2.8.0",
    "torchvision>=0.24.1",
    "transformers>=4.57.3",
    "trl>=0.12.0",
    "datasets>=2.18.0",
]
# Note: Unsloth requires manual installation: pip install unsloth
# See https://docs.unsloth.ai/get-started/installation

dev = [
    "build>=1.0.0",  # tests/test_packaging.py builds the wheel
    "pytest>=9.0.0",
    # Bounded on purpose. `ruff>=0.1.0` let any runner resolve any future ruff,
    # and ruff 0.16.0 changed two implicit contracts at once (see [tool.ruff]).
    # Under 0.16 defaults this tree reports 1035 findings in `openadapt_ml/`
    # and 3 documentation files reformat, none of it caused by a commit here.
    # Raise this ceiling deliberately, with the new findings resolved in the
    # same change.
    "ruff>=0.16,<0.17",
]
# Benchmark evaluation (depends on openadapt-evals)
benchmarks = [
    "openadapt-evals>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/OpenAdaptAI/openadapt-ml"
Repository = "https://github.com/OpenAdaptAI/openadapt-ml"
Documentation = "https://github.com/OpenAdaptAI/openadapt-ml/tree/main/docs"



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openadapt_ml"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "openadapt_ml/configs"

[tool.uv.sources]
openadapt-capture = { path = "../openadapt-capture", editable = true }

# ---------------------------------------------------------------------------
# Ruff
#
# Everything ruff decides for this repository is written down here. Until
# 2026-07-27 this file had no `[tool.ruff]` section at all, so line length,
# target version, which FILES ruff touched, and which RULES it applied were all
# inherited from whatever ruff version a runner happened to resolve.
#
# ruff 0.16.0 then changed both halves of that implicit contract at once:
#   * the default rule set grew from 59 rules to 413; and
#   * the default `include` gained "*.md", so `ruff format` started rewriting
#     Python code blocks inside documentation.
# Neither needed a commit in this repository to take effect. That is the
# failure mode this section exists to remove: a future ruff release must change
# nothing here until a person edits this file.
# ---------------------------------------------------------------------------
[tool.ruff]
# 88, not the OpenAdapt house value of 100, because `openadapt_ml/` is already
# formatted at 88 and always has been. Recording the value the tree actually
# uses is the point; switching to 100 would rewrap 70 of 112 files for no
# behavioural gain and would bury this change. E501 is not enforced (see
# below), so this governs the formatter only.
line-length = 88

# The lowest interpreter this package supports (`requires-python = ">=3.10"`,
# and CI runs 3.10 and 3.11). Previously inferred from requires-python; pinned
# so inference changes cannot move it.
target-version = "py310"

# ruff 0.16.0's default `include` list, minus "*.md". Documentation here
# contains illustrative and deliberately partial snippets; a Python formatter
# rewriting prose is not a contract this repository wants, and it arrived
# without a commit. Pinned in full so a future addition to the default list is
# likewise inert until someone adds it here.
include = [
    "*.py",
    "*.pyi",
    "*.pyw",
    "*.ipynb",
    "**/pyproject.toml",
    "**/ruff.toml",
    "**/.ruff.toml",
]

[tool.ruff.lint]
# An explicit, bounded rule set rather than ruff's defaults.
#
# Why bounded: ruff 0.16 defaults report 1035 findings in `openadapt_ml/`
# alone. That is not a set anyone can review honestly in one change, and ~90%
# of it is not defect-finding — 581 are `UP` typing modernisations
# (`Optional[X]` -> `X | None`, `List` -> `list`), 156 are `BLE001` on
# best-effort dashboard and status probes that are deliberately blind, and 73
# are `PLW1510` (`subprocess.run` without `check=`), where every fix is a
# behaviour change needing per-call judgement. Adopting 413 rules by accident
# is the opposite of the predictability this section is for. Each of those
# families can be adopted later, deliberately, on its own merits.
#
# Why THIS set: `E,F,I,W` is the OpenAdapt house selection (openadapt-capture,
# -privacy, -telemetry, -crier, -herald, -desktop, OpenAdapt) and is already
# WIDER than what this repository enforced before — ruff's old default was
# effectively `E4,E7,E9,F`, so `I` (import sorting) and the rest of `E`/`W` are
# net new coverage, not a retreat.
#
# `B` (flake8-bugbear) is added on top because it is the one extra family that
# pays for itself here: 36 findings repository-wide, all real defect shapes
# rather than style — `B905` (`zip()` silently truncating to the shorter
# sequence), `B904` (exception chaining lost inside `except`), `B007`. That is
# a reviewable number and it guards code paths that pair model outputs with
# ground truth, where a silent length mismatch is exactly the kind of quiet
# wrong answer this project cares about.
#
# `PIE794` is added as a single rule, not the `PIE` family. The ruff 0.16 audit
# found `task_dir` declared twice in `GRPOConfig`; nothing in `B,E,F,I,W`
# catches a duplicated class field, so that defect could return the moment the
# audit stopped. The rest of `PIE` is style and is not adopted here. Repository
# count at the time of adoption: 0.
ignore = [
    # Line length is left to the formatter. `ruff format` already wraps what it
    # can; the residue is long string literals, URLs and comments that E501
    # would only push into worse line breaks. Every OpenAdapt repository
    # ignores E501 for this reason.
    "E501",
]
select = ["B", "E", "F", "I", "PIE794", "W"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore: release {version}"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
